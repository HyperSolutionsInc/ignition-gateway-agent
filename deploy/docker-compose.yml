# One container: Ignition 8.3 + gateway-agent. Nothing to configure for a standard site:
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# On first start it commissions Ignition, mints its API key, provisions its AWS IoT identity
# from the claim certificate baked into the image, and installs the IMSs the cloud assigns it.

services:
  gateway:
    image: ${GATEWAY_IMAGE:-hyper-gateway:0.2.0}
    container_name: gateway
    restart: unless-stopped
    ports:
      # Gateway webpage and Designer. Publish on the plant LAN only.
      - "${GATEWAY_PUBLISH_ADDR:-0.0.0.0}:8088:8088"
      - "${GATEWAY_PUBLISH_ADDR:-0.0.0.0}:8043:8043"
    environment:
      # Optional: a stable serial (e.g. the box's asset tag). Otherwise one is generated and kept.
      GATEWAY_SERIAL: ${GATEWAY_SERIAL:-}
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
      - gateway-agent:/var/lib/gateway-agent

volumes:
  gateway-data:
  gateway-agent:
