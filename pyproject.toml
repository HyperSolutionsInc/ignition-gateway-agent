[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-agent"
description = "Ignition gateway sidecar: HAMF IMS import, AWS IoT telemetry uplink, Device Shadow config"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gateway-agent = "gateway_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gateway_agent.__version__" }

[tool.setuptools.packages.find]
include = ["gateway_agent*"]

[tool.setuptools.package-data]
"gateway_agent.ignition_scripts" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
